<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="30" y="36" font-size="21" font-weight="bold" fill="#0f172a">Uji Qwen3.8-27B di GTX 1070 Ti: urutan dan ketergantungan</text>
  <text x="30" y="58" font-size="13" fill="#64748b">Hanya rencana. Tidak ada yang dikerjakan di issue ini; semua alat sudah ada di tools/legacy.py</text>

  <rect x="30" y="76" width="14" height="14" rx="3" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="50" y="88" font-size="12.5" fill="#334155">Butuh tindakan pemilik mesin</text>
  <rect x="270" y="76" width="14" height="14" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="290" y="88" font-size="12.5" fill="#334155">Pengukuran</text>
  <rect x="400" y="76" width="14" height="14" rx="3" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="420" y="88" font-size="12.5" fill="#334155">Keputusan</text>

  <rect x="30" y="110" width="270" height="130" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="165" y="136" font-size="15" font-weight="bold" text-anchor="middle" fill="#713f12">27B-0 Prasyarat</text>
  <text x="46" y="160" font-size="13" fill="#334155">GPU kosong (server 9B berhenti)</text>
  <text x="46" y="180" font-size="13" fill="#334155">GGUF 27B diunduh + sha256</text>
  <text x="46" y="200" font-size="13" fill="#334155">gguf inspect cocok kartu resmi</text>
  <text x="46" y="220" font-size="13" fill="#334155">dmidecode: single/dual channel</text>

  <rect x="345" y="110" width="270" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="136" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">27B-1 Hybrid (strategi A)</text>
  <text x="480" y="158" font-size="12.5" text-anchor="middle" fill="#334155">Q4_K_M, IQ4_XS, IQ3_M; auto-fit/-ngl</text>
  <rect x="345" y="184" width="270" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="208" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">27B-2 Hampir penuh (B, D)</text>
  <text x="480" y="228" font-size="12.5" text-anchor="middle" fill="#334155">Q3-DOWN-XS; Vulkan vs CUDA; -fa; KV</text>
  <rect x="660" y="110" width="270" height="130" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="795" y="136" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">27B-3 MTP (strategi C)</text>
  <text x="676" y="160" font-size="13" fill="#334155">Build llama.cpp utama (fork tanpa</text>
  <text x="676" y="180" font-size="13" fill="#334155">draft-mtp); depth 1, 2, 3</text>
  <text x="676" y="200" font-size="13" fill="#334155">Plain vs MTP lewat llama compare;</text>
  <text x="676" y="220" font-size="13" fill="#334155">cek keluaran identik di temp 0</text>

  <path d="M165 240 L165 270 L480 270 L480 240" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M165 240 L165 290 L795 290 L795 240" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="264" font-size="12" text-anchor="middle" fill="#64748b">semua butuh 27B-0</text>

  <rect x="30" y="320" width="450" height="110" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#1e3a8a">27B-4 Kualitas</text>
  <text x="46" y="370" font-size="13" fill="#334155">PPL + KLD untuk minimal tiga quant, satu protokol</text>
  <text x="46" y="390" font-size="13" fill="#334155">8 prompt tetap; dampak KV q8_0/q4_0/iso3</text>
  <text x="46" y="410" font-size="13" fill="#334155">Referensi: quant tertinggi yang muat (bukan BF16)</text>
  <path d="M480 240 L480 300 L255 300 L255 320" fill="none" stroke="#64748b" stroke-width="2"/>

  <rect x="510" y="320" width="420" height="110" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="720" y="346" font-size="15" font-weight="bold" text-anchor="middle" fill="#312e81">Keputusan akhir</text>
  <text x="526" y="370" font-size="13" fill="#334155">Quant + strategi terbaik di 1070 Ti</text>
  <text x="526" y="390" font-size="13" fill="#334155">Target MASTER: A min 1.5 tok/s, B min 8 tok/s</text>
  <text x="526" y="410" font-size="13" fill="#334155">RAM puncak maksimum 15 GiB tanpa swap</text>
  <path d="M480 375 L510 375" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M795 240 L795 300 L720 300 L720 320" fill="none" stroke="#64748b" stroke-width="2"/>

  <rect x="30" y="452" width="900" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="46" y="476" font-size="13" fill="#334155">Alat yang dipakai: budget, hw (gpu clock/throttle, membw, faults), gguf, llama (build, run, bench, compare, placement),</text>
  <text x="46" y="496" font-size="13" fill="#334155">bench analyze, quality (ppl, kld, prompts). Semua sudah diuji pada 0.8B dan 9B di CPU, belum pada GPU atau 27B.</text>
  <text x="46" y="516" font-size="13" fill="#334155">Risiko terbesar: kernel Gated DeltaNet 27B di SM 6.1 dengan llama.cpp utama, dan VRAM 8 GiB yang hampir penuh.</text>
</svg>
