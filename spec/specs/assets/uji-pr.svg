<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="t d">
  <title id="t">Alur PR tunggal</title>
  <desc id="d">Tiga kotak: Issue, PR, Review, dihubungkan panah dari kiri ke kanan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="560" height="220" fill="#ffffff"/>
  <text x="280" y="34" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#222222">Alur PR tunggal</text>

  <rect x="30" y="80" width="130" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="95" y="116" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">Issue</text>

  <rect x="215" y="80" width="130" height="60" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="280" y="116" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">PR</text>

  <rect x="400" y="80" width="130" height="60" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="465" y="116" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#222222">Review</text>

  <line x1="160" y1="110" x2="213" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="345" y1="110" x2="398" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="30" y="190" font-family="sans-serif" font-size="12" fill="#444444">Legenda: kotak = tahap, panah = urutan alur.</text>
</svg>
