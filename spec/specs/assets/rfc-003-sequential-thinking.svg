<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">Agent /kiro berpikir bertahap sebelum bertindak</text>
  <text x="30" y="54" font-size="13" fill="#64748b">Tool sequentialthinking (MCP) menguraikan maksud permintaan dulu, baru agent mengerjakan atau membalas.</text>

  <!-- alur utama -->
  <rect x="30" y="80" width="150" height="76" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="105" y="108" font-size="14" font-weight="bold" fill="#075985" text-anchor="middle">Komentar /kiro</text>
  <text x="105" y="128" font-size="12" fill="#334155" text-anchor="middle">di issue atau PR</text>
  <text x="105" y="144" font-size="12" fill="#334155" text-anchor="middle">oleh 3 ID resmi</text>

  <path d="M180 118 L214 118" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="214" y="80" width="150" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="289" y="108" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Pemantau</text>
  <text x="289" y="128" font-size="12" fill="#334155" text-anchor="middle">filter ID dan batas</text>
  <text x="289" y="144" font-size="12" fill="#334155" text-anchor="middle">12 run per jam</text>

  <path d="M364 118 L398 118" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="398" y="80" width="150" height="76" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="473" y="108" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">kiro-cli</text>
  <text x="473" y="128" font-size="12" fill="#334155" text-anchor="middle">agent legacy-bot</text>
  <text x="473" y="144" font-size="12" fill="#334155" text-anchor="middle">--require-mcp-startup</text>

  <path d="M548 118 L582 118" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="582" y="80" width="348" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="756" y="108" font-size="14" font-weight="bold" fill="#92400e" text-anchor="middle">Hasil: balasan, atau PR bila perlu</text>
  <text x="756" y="128" font-size="12" fill="#334155" text-anchor="middle">Jawaban diawali "Pemahaman" (maks 3 baris)</text>
  <text x="756" y="144" font-size="12" fill="#334155" text-anchor="middle">lalu "Keputusan: perlu / tidak perlu PR"</text>

  <!-- kotak berpikir -->
  <path d="M473 156 L473 188" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="30" y="188" width="900" height="168" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="46" y="214" font-size="15" font-weight="bold" fill="#5b21b6">Di dalam kiro-cli: tool sequentialthinking dipanggil beberapa kali sebelum bertindak</text>

  <rect x="46" y="232" width="200" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="146" y="256" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Langkah 1</text>
  <text x="146" y="278" font-size="12" fill="#334155" text-anchor="middle">Apa yang sebenarnya</text>
  <text x="146" y="296" font-size="12" fill="#334155" text-anchor="middle">diminta?</text>
  <path d="M246 284 L276 284" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="276" y="232" width="200" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="376" y="256" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Langkah 2</text>
  <text x="376" y="278" font-size="12" fill="#334155" text-anchor="middle">Apa yang tersirat</text>
  <text x="376" y="296" font-size="12" fill="#334155" text-anchor="middle">atau ambigu?</text>
  <path d="M476 284 L506 284" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="506" y="232" width="200" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="606" y="256" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Langkah 3</text>
  <text x="606" y="278" font-size="12" fill="#334155" text-anchor="middle">Perlu ubah file</text>
  <text x="606" y="296" font-size="12" fill="#334155" text-anchor="middle">atau cukup membalas?</text>
  <path d="M706 284 L736 284" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="736" y="232" width="178" height="104" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="825" y="256" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Langkah 4</text>
  <text x="825" y="278" font-size="12" fill="#334155" text-anchor="middle">Risiko dan hal</text>
  <text x="825" y="296" font-size="12" fill="#334155" text-anchor="middle">yang belum diketahui</text>
  <text x="825" y="322" font-size="12" fill="#5b21b6" text-anchor="middle">boleh direvisi</text>

  <!-- pemasangan dan keamanan -->
  <rect x="30" y="378" width="440" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="46" y="402" font-size="13" font-weight="bold" fill="#166534">Pemasangan (tanpa sudo)</text>
  <text x="46" y="422" font-size="12" fill="#334155">Node 24 dengan checksum, paket MCP versi dikunci 2.1.1,</text>
  <text x="46" y="438" font-size="12" fill="#334155">tanpa skrip pemasangan, 0 kerentanan di npm audit</text>

  <rect x="490" y="378" width="440" height="72" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="506" y="402" font-size="13" font-weight="bold" fill="#991b1b">Batas izin</text>
  <text x="506" y="422" font-size="12" fill="#334155">Hanya server sequential-thinking yang diizinkan (mcp), dan tool</text>
  <text x="506" y="438" font-size="12" fill="#334155">ini tidak menyentuh file atau jaringan. Shell tetap ditolak.</text>
</svg>
