  <title id="title">qwen38-engine: kuantisasi, TPS, konteks, dan intelligence</title>
  <desc id="desc">Matriks hasil terukur untuk kuantisasi Qwen dan Ternary Bonsai, throughput per konteks, hasil intelligence, serta batas dukungan engine di GTX 1070 Ti.</desc>

