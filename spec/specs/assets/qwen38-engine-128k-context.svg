  <rect x="60" y="2030" width="1320" height="390" class="panel"/>
  <rect x="60" y="2030" width="7" height="390" fill="url(#cyan)" rx="4"/>
  <text x="105" y="2082" class="panel-title">D • Batas engine dan interpretasi</text>

  <rect x="100" y="2110" width="620" height="190" class="card"/>
  <text x="125" y="2146" class="card-title">Kuantisasi di jalur engine</text>
  <text x="125" y="2180" class="td">Qwen: Q3_K, Q4_K, Q5_K, Q6_K, Q8_0, IQ4_NL, IQ3_S, IQ4_XS.</text>
  <text x="125" y="2212" class="td">Bonsai: PTQ1_0 dan Q2_0 dengan basis Hadamard.</text>
  <text x="125" y="2244" class="td">PQ2_0 type 142: <tspan class="amber-text">belum didukung dan belum diukur</tspan>.</text>
  <text x="125" y="2276" class="small">Kernel ternary v2: 135/135 byte-identical terhadap referensi a89f467.</text>

  <rect x="760" y="2110" width="580" height="190" class="card"/>
  <text x="785" y="2146" class="card-title">Konteks dan kernel</text>
  <text x="785" y="2180" class="td">Qwen K-quant maksimum 8192; Bonsai maksimum 131072.</text>
  <text x="785" y="2212" class="td">≤8192 shared-memory; di atasnya tiled prefill + split-K decode.</text>
  <text x="785" y="2244" class="td">State round-trip Qwen, PTQ1_0, Q2_0 PASS pada konfigurasi sama.</text>
  <text x="785" y="2276" class="small">Prefill penuh 128K belum dijalankan; kualitas 128K belum diukur.</text>

  <rect x="100" y="2320" width="1240" height="70" class="card"/>
