  <text x="80" y="78" class="title">qwen38-engine — Kuantisasi, TPS, Konteks, Intelligence</text>
  <text x="80" y="115" class="subtitle">Hasil terukur pada GTX 1070 Ti SM 6.1, Ryzen 5 2400G, dan 16 GB DDR4 • satu runtime GPU pada satu waktu</text>

  <rect x="80" y="135" width="390" height="37" class="chip"/>
  <text x="275" y="159" text-anchor="middle" class="small">GTX 1070 Ti • Ryzen 5 2400G • 16 GB DDR4</text>
  <rect x="485" y="135" width="350" height="37" class="chip"/>
  <text x="660" y="159" text-anchor="middle" class="small">temperature 0 • seed 42 • sequential GPU</text>
  <rect x="850" y="135" width="310" height="37" class="chip"/>
  <text x="1005" y="159" text-anchor="middle" class="small">7373 MiB VRAM • 14,2 GB RAM</text>
  <rect x="1175" y="135" width="185" height="37" class="chip"/>
  <text x="1267" y="159" text-anchor="middle" class="small">2026-11-19</text>

  <rect x="60" y="200" width="1320" height="700" class="panel"/>
  <rect x="60" y="200" width="7" height="700" fill="url(#cyan)" rx="4"/>
  <text x="105" y="252" class="panel-title">A • Kuantisasi dan decode tok/s terukur</text>
  <text x="105" y="285" class="muted">Semua nilai adalah hasil di mesin ini; tanda “/” memisahkan dua konfigurasi runtime yang berbeda.</text>

