<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="520" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="bold" fill="#0f172a">Apa yang dilakukan /kiro tergantung di mana komentarnya ditulis</text>
  <text x="30" y="54" font-size="13" fill="#64748b">PR hanya dibuat bila memang perlu. Di dalam PR, semuanya dibahas di PR itu.</text>

  <!-- Kolom 1: komentar di PR -->
  <rect x="30" y="76" width="285" height="390" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="46" y="104" font-size="15" font-weight="bold" fill="#075985">1. Komentar di dalam PR</text>
  <rect x="46" y="120" width="253" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="172" y="142" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">/kiro ... (di PR #25)</text>
  <text x="172" y="160" font-size="12" fill="#334155" text-anchor="middle">dibahas di PR itu</text>
  <path d="M172 172 L172 200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="46" y="200" width="253" height="50" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="172" y="222" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Pertanyaan atau diskusi?</text>
  <text x="172" y="240" font-size="12" fill="#334155" text-anchor="middle">jawab di PR, tanpa ubah file</text>
  <path d="M172 250 L172 278" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="46" y="278" width="253" height="50" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="172" y="300" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Minta perubahan?</text>
  <text x="172" y="318" font-size="12" fill="#334155" text-anchor="middle">commit ke branch PR itu</text>
  <rect x="46" y="350" width="253" height="100" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="62" y="376" font-size="13" font-weight="bold" fill="#075985">Tidak pernah PR baru</text>
  <text x="62" y="398" font-size="12" fill="#334155">Pesan awal: "Dibahas dan</text>
  <text x="62" y="416" font-size="12" fill="#334155">dikerjakan di PR ini (#N)"</text>
  <text x="62" y="438" font-size="12" fill="#334155">Teruji: PR #25 (uji nyata)</text>

  <!-- Kolom 2: issue tanpa PR -->
  <rect x="337" y="76" width="285" height="390" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="353" y="104" font-size="15" font-weight="bold" fill="#92400e">2. Issue yang belum punya PR</text>
  <rect x="353" y="120" width="253" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="479" y="142" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">/kiro ... (di issue)</text>
  <text x="479" y="160" font-size="12" fill="#334155" text-anchor="middle">analisis dulu</text>
  <path d="M479 172 L479 200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="353" y="200" width="253" height="50" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <text x="479" y="222" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Perlu ubah file?</text>
  <text x="479" y="240" font-size="12" fill="#334155" text-anchor="middle">agent memutuskan dan menulisnya</text>
  <path d="M400 250 L400 286" stroke="#16a34a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M558 250 L558 286" stroke="#dc2626" stroke-width="2" marker-end="url(#arr)"/>
  <text x="392" y="270" font-size="12" font-weight="bold" fill="#166534" text-anchor="end">tidak</text>
  <text x="566" y="270" font-size="12" font-weight="bold" fill="#991b1b">ya</text>
  <rect x="353" y="286" width="120" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="413" y="312" font-size="13" font-weight="bold" fill="#166534" text-anchor="middle">Balasan saja</text>
  <text x="413" y="334" font-size="12" fill="#334155" text-anchor="middle">tanpa PR</text>
  <text x="413" y="354" font-size="12" fill="#334155" text-anchor="middle">(uji: issue #23)</text>
  <rect x="486" y="286" width="120" height="86" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="546" y="312" font-size="13" font-weight="bold" fill="#991b1b" text-anchor="middle">Satu PR</text>
  <text x="546" y="334" font-size="12" fill="#334155" text-anchor="middle">branch kiro/...</text>
  <text x="546" y="354" font-size="12" fill="#334155" text-anchor="middle">(uji: PR #25)</text>
  <rect x="353" y="390" width="253" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="369" y="414" font-size="12" font-weight="bold" fill="#92400e">Pengaman</text>
  <text x="369" y="432" font-size="12" fill="#334155">Bila agent bilang "tidak perlu PR"</text>
  <text x="369" y="446" font-size="12" fill="#334155">tapi mengubah file, tidak di-commit</text>

  <!-- Kolom 3: issue dengan PR -->
  <rect x="644" y="76" width="286" height="390" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="660" y="104" font-size="15" font-weight="bold" fill="#5b21b6">3. Issue yang sudah punya PR</text>
  <rect x="660" y="120" width="254" height="52" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="787" y="142" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">/kiro ... (di issue)</text>
  <text x="787" y="160" font-size="12" fill="#334155" text-anchor="middle">PR terbuka ditemukan</text>
  <path d="M787 172 L787 200" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="660" y="200" width="254" height="80" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="787" y="226" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Perubahan masuk ke PR itu</text>
  <text x="787" y="248" font-size="12" fill="#334155" text-anchor="middle">bukan PR baru</text>
  <text x="787" y="266" font-size="12" fill="#334155" text-anchor="middle">pertanyaan: balasan saja</text>
  <rect x="660" y="304" width="254" height="146" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="676" y="330" font-size="13" font-weight="bold" fill="#5b21b6">Mencegah kasus PR #19</text>
  <text x="676" y="352" font-size="12" fill="#334155">Dulu perintah lanjutan di issue</text>
  <text x="676" y="370" font-size="12" fill="#334155">membuka PR terpisah. Sekarang</text>
  <text x="676" y="388" font-size="12" fill="#334155">PR yang sudah ada dipakai lagi.</text>
  <text x="676" y="416" font-size="12" fill="#334155">Fork dan branch non-kiro tidak</text>
  <text x="676" y="434" font-size="12" fill="#334155">pernah dipilih.</text>

  <text x="30" y="494" font-size="12" fill="#64748b">Warna: biru = di dalam PR · kuning = issue baru · ungu = issue dengan PR · hijau = tanpa PR · merah = PR dibuat. Merge tetap oleh manusia.</text>
</svg>
